name: newt_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - click>=8
  - numpy>=1.23
  - pandas>=2
  - scipy
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn
  - networkx>=3.0
  - gensim
  - scanpy
  - leidenalg
  - python-igraph
  - igraph
  - libstdcxx-ng
  - pip:
      - tensorflow[and-cuda]==2.19.1
      - mygene>=3.2

variables:
  PYTHONNOUSERSITE: "1"
